apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: autonomous-project
  namespace: agent-autonomous
spec:
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
