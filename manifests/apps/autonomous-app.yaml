apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-emulatorjs-autonomous
  namespace: agent-autonomous
spec:
  project: autonomous-project
  source:
    repoURL: https://github.com/cjcocokrisp/devconf-argocd-agent-demo
    targetRevision: HEAD
    path: manifests/resources
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-emulatorjs
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
