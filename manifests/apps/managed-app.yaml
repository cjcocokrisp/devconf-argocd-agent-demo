apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emulatorjs-managed-example
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cjcocokrisp/devconf-argocd-agent-demo
    targetRevision: HEAD
    path: manifests/resources/managed
  destination:
    name: agent-managed
    namespace: emulatorjs
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
