apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-emulatorjs-managed
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cjcocokrisp/devconf-argocd-agent-demo
    targetRevision: HEAD
    path: manifests/resources
  destination:
    name: agent-managed
    namespace: nginx-emulatorjs
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
