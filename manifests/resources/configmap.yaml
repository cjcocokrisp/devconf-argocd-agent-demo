apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-emulatorjs-static-content
data:
  nginx.conf: |
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        root /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>DevConf 2026 Demo</title>
        <style>
            html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
            #game { width: 100%; height: 100%; }
        </style>
    </head>
    <body>

        <div id="game"></div>

        <script>
            var EJS_player = '#game';
            var EJS_core = 'gba';
            var EJS_gameName = 'Apotris';
            var EJS_gameUrl = '/roms/Apotris.gba';

            var EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            var EJS_threads = true;
        </script>
        <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

    </body>
    </html>
